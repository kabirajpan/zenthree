[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python_demo"
version = "0.1.0"
description = "An intermediate-level Python project scaffold"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "mypy>=1.0"
]

[project.scripts]
python-demo = "python_demo.main:main"

[tool.setuptools]
packages = ["python_demo"]
include-package-data = true

python-demo = "python_demo.main:main"
