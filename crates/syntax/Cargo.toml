[package]
name = "syntax"
version = "0.1.0"
edition = "2021"
description = "Syntax highlighting engine for Zenthree"

[dependencies]
zenthra-core = { path = "../../../../crates/zenthra-core" }
editor = { path = "../editor" }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21.2"
tree-sitter-html = "0.20.4"
tree-sitter-css = "0.21.1"
tree-sitter-json = "0.21.0"
tree-sitter-yaml = "0.6.1"
tree-sitter-go = "0.21.2"
tree-sitter-c = "0.21.4"
tree-sitter-cpp = "0.22.0"
tree-sitter-java = "0.21.0"
tree-sitter-md = "0.2.3"
tree-sitter-bash = "0.21.0"
tree-sitter-highlight = "0.22"
regex = "1.10"
dirs = "5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
