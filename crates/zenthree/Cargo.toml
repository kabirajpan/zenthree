[package]
name = "zenthree"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
zenthra = { path = "../../../../crates/zenthra" }
zenthra-core = { path = "../../../../crates/zenthra-core" }
zenthra-widgets = { path = "../../../../crates/zenthra-widgets" }
zenthra-platform = { path = "../../../../crates/zenthra-platform" }
zenthra-text = { path = "../../../../crates/zenthra-text" }
zenthra-render = { path = "../../../../crates/zenthra-render" }
zenthra-state = { path = "../../../../crates/zenthra-state" }
editor = { path = "../editor" }
syntax = { path = "../syntax" }
formatter = { path = "../formatter" }
agent = { path = "../agent" }
winit = "0.30"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
dirs = "5"
rust-embed = "8.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.6.1"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.12", default-features = false }
notify = "8"
